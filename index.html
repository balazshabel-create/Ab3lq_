<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="Jungle Jukebox — a 3D multiplayer social-deduction survival game set in the Amazon rainforest. Everyone is an animal. One of them is hunting you." />
    <meta name="theme-color" content="#0a1410" />
    <!-- Inline SVG favicon: keeps the project asset-free and avoids a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E"
    />
    <title>🌴 Jungle Jukebox</title>
  </head>
  <body>
    <!-- The 3D view. Sits behind the UI, which is plain DOM. -->
    <canvas id="game-canvas"></canvas>
    <!-- Every screen (menu, lobby, HUD, results) is mounted here. -->
    <div id="ui-root"></div>
    <noscript>
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a1410; color: #f3ede1; font-family: sans-serif; text-align: center; padding: 24px;">
        Jungle Jukebox needs JavaScript and WebGL to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
