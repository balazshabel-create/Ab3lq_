<!doctype html>
<!--
  gait-view.html — one animal, moving, driven by the game's own animator.

  ## Why this exists

  model-view.html shows a model standing still, which answers "does it look
  right" and nothing at all about "does it move right". The animation is the
  half of an animal a player actually judges, and until this page the only way
  to see it was to play a round and hope the species you wanted ran past.

  This drives AnimalRenderer directly with a synthetic snapshot stream — an
  animal running a circle at a chosen speed — so what you see is the real gait
  code, not a re-implementation of it:

      /tools/gait-view.html?species=jaguar&gait=1&turn=0.5

  `?frame=N` freezes the clock at one point in the stride, which is how the
  cycle gets photographed: eight frames across one stride tell you whether the
  footfalls are in the right order, and no amount of watching it live does.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>JukeJungle gait view</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6f7d63; }
      canvas { display: block; }
      #label {
        position: fixed; left: 12px; top: 10px; font: 13px/1.4 monospace;
        color: #fff; text-shadow: 0 1px 2px #000; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      import * as THREE from 'three';
      import { AnimalRenderer } from '/src/Render/AnimalRenderer.ts';
      import { ANIMALS } from '/src/Animals/AnimalTypes.ts';
      import { presetSettings } from '/src/Graphics/QualitySettings.ts';

      const q = new URLSearchParams(location.search);
      const species = q.get('species') ?? 'jaguar';
      const gait = Number(q.get('gait') ?? 1);
      const turn = Number(q.get('turn') ?? 0);
      const frame = q.has('frame') ? Number(q.get('frame')) : null;
      const def = ANIMALS[species];

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x6f7d63);
      const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
      sun.position.set(4, 9, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      const s = 6;
      sun.shadow.camera.left = -s;
      sun.shadow.camera.right = s;
      sun.shadow.camera.top = s;
      sun.shadow.camera.bottom = -s;
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x3f4a30, 1.5));
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(40, 48).rotateX(-Math.PI / 2),
        new THREE.MeshLambertMaterial({ color: 0x5d6b4f }),
      );
      ground.receiveShadow = true;
      scene.add(ground);

      const animals = new AnimalRenderer(scene, presetSettings('high'));
      // Flat ground, no water: this is a test rig, not a world.
      animals.setGroundSampler(() => 0);
      animals.setWaterTest(() => false);
      animals.setLocalActor(0);

      const size = Math.max(def.silhouette.length, def.silhouette.height);
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 200);

      /*
       * The animal runs a circle of a radius chosen from `turn`, so the turn
       * rate the animator sees is the real thing — derived from consecutive
       * poses, exactly as it is in a round.
       */
      // Metres per second, near enough: the animator only cares about the gait
      // value and the poses it is handed, not about matching the sim exactly.
      const speed = 4.2 * def.locomotion.landSpeed * (0.35 + gait * 1.3);
      const radius = turn > 0.01 ? Math.max(3, speed / (turn * 1.4)) : 0;

      let simTime = 0;
      function pose(t) {
        if (radius === 0) return { x: 0, z: -t * speed, yaw: -Math.PI / 2 };
        const a = (t * speed) / radius;
        return { x: Math.cos(a) * radius, z: Math.sin(a) * radius, yaw: a + Math.PI / 2 };
      }

      // Snapshots at the game's own rate, so the interpolator is exercised too.
      const SNAP = 0.1;
      let nextSnap = 0;

      function step(dt) {
        simTime += dt;
        while (nextSnap <= simTime) {
          const p = pose(nextSnap);
          animals.applySnapshot([
            { id: 1, species, x: p.x, y: 0, z: p.z, yaw: p.yaw, gait, flags: 0, flies: 0 },
          ]);
          nextSnap += SNAP;
        }
        animals.update(dt, camera.position, simTime);
      }

      /*
       * Side on, slightly behind, at about shoulder height.
       *
       * A gait is judged from the side — that is the angle every reference film
       * of a running animal is shot from, because it is the only one where the
       * fore-aft position of all four feet is visible at once. From behind, the
       * camera the game actually uses, a gallop and a trot look identical.
       */
      function frameCamera() {
        const p = pose(simTime - 0.13);
        const side = Number(q.get('side') ?? 1);
        const away = size * 2.3;
        const rx = Math.cos(p.yaw + Math.PI / 2) * side;
        const rz = Math.sin(p.yaw + Math.PI / 2) * side;
        camera.position.set(
          p.x + rx * away - Math.cos(p.yaw) * size * 0.5,
          Math.max(0.7, def.silhouette.height * 1.15),
          p.z + rz * away - Math.sin(p.yaw) * size * 0.5,
        );
        camera.lookAt(p.x, def.silhouette.height * 0.45, p.z);
      }

      document.getElementById('label').textContent =
        `${def.name}  gait ${gait.toFixed(2)}  turn ${turn.toFixed(2)}` +
        (frame === null ? '' : `  frame ${frame}`);

      if (frame === null) {
        // Live: run it.
        let last = performance.now();
        const loop = () => {
          const now = performance.now();
          step(Math.min(0.05, (now - last) / 1000));
          last = now;
          frameCamera();
          renderer.render(scene, camera);
          requestAnimationFrame(loop);
        };
        // A second of warm-up so the interpolation buffer is full.
        for (let i = 0; i < 60; i++) step(1 / 60);
        loop();
        window.__gaitReady = true;
      } else {
        /*
         * Frozen: step to a fixed point in the stride and stop.
         *
         * The frame index is in eighths of a stride, and the stride rate is the
         * animator's own — otherwise a sequence of stills would be a sequence
         * of arbitrary moments rather than a cycle.
         */
        const strideRate = 9 / Math.max(0.35, def.silhouette.length * 0.85);
        const stride = (Math.PI * 2) / Math.max(0.05, gait * strideRate);
        const target = 2 + (frame / 8) * stride;
        while (simTime < target) step(1 / 120);
        frameCamera();
        renderer.render(scene, camera);
        window.__gaitReady = true;
      }
    </script>
  </body>
</html>
