<!doctype html>
<!--
  model-view.html — a turntable for one animal model.

  This is a development page, not part of the game. It exists because the only
  way to judge whether a model looks right is to look at it, and finding a
  particular species inside a live round means playing until the game deals it
  to you. Here you name it in the query string and it stands in front of you:

      /tools/model-view.html?species=hunter&detail=1

  It builds the model with exactly the function the game uses, so anything you
  see here is what the game draws.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>JukeJungle model view</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6f7d63; }
      canvas { display: block; }
      #label {
        position: fixed; left: 12px; top: 10px; font: 13px/1.4 monospace;
        color: #fff; text-shadow: 0 1px 2px #000; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      import * as THREE from 'three';
      import { buildAnimalModel } from '/src/Render/AnimalModels.ts';
      import { buildShotgunViewmodel, initWeaponEnvironment } from '/src/Render/Weapon.ts';
      import { ANIMALS } from '/src/Animals/AnimalTypes.ts';

      const params = new URLSearchParams(location.search);
      const species = params.get('species') ?? 'hunter';
      const detail = Number(params.get('detail') ?? 1);
      // 0 = broadside, which is the view that shows a silhouette best.
      const angle = Number(params.get('angle') ?? 0);
      const spin = params.get('spin') === '1';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x6f7d63);

      // Roughly the game's daylight rig, so colours read the same here.
      const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
      sun.position.set(4, 8, 3);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -4;
      sun.shadow.camera.right = 4;
      sun.shadow.camera.top = 4;
      sun.shadow.camera.bottom = -4;
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x3f4a30, 1.5));

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(14, 48).rotateX(-Math.PI / 2),
        new THREE.MeshLambertMaterial({ color: 0x5d6b4f }),
      );
      ground.receiveShadow = true;
      scene.add(ground);

      /*
       * `?viewmodel=1` shows the gun the hunter sees instead of an animal.
       *
       * It is the most-looked-at object in the game — it sits in front of one
       * player's eyes for a whole round — and it is the one thing that cannot be
       * photographed from the turntable, because it lives on the camera rather
       * than in the world.
       */
      if (params.get('viewmodel') === '1') {
        // The metal needs something to reflect, and the prefilter needs a live
        // GL context — same call the game makes at renderer construction.
        initWeaponEnvironment(renderer);
        const gun = buildShotgunViewmodel();
        // The real one hangs bottom-right of the camera; this reproduces that
        // offset so the framing matches what a player actually sees.
        // These must match Renderer.setViewWeapon's per-frame transform.
        gun.position.set(0.17, -0.17, -0.48);
        gun.rotation.set(0.04, 0.15, 0.05);
        gun.scale.setScalar(0.85);
        const rig = new THREE.Group();
        rig.add(gun);
        scene.add(rig);
        // The game's own fov, so this framing is the framing a player gets.
        const cam = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.01, 50);
        renderer.render(scene, cam);
        window.__modelReady = true;
        throw new Error('viewmodel drawn');
      }

      const model = buildAnimalModel(species, detail);
      scene.add(model.root);

      /*
       * `pose=swim` reproduces the limb tuck the animator applies to a reptile
       * in water. The angles are copied from AnimalRenderer rather than shared,
       * because the animator is a method on a class that needs a scene and a
       * terrain to exist — if the two ever drift apart, this page is the one
       * that is wrong.
       */
      if (params.get('pose') === 'swim') {
        for (let i = 0; i < model.legs.length; i++) {
          const leg = model.legs[i];
          const knee = model.knees[i];
          const side = leg.userData.side ?? (i % 2 === 0 ? 1 : -1);
          const front = leg.userData.front ?? i < 2;
          leg.rotation.y = -side * (front ? 1.15 : 1.1);
          leg.rotation.x = side * 0.45;
          if (knee) knee.rotation.z = -0.95;
        }
      }

      const def = ANIMALS[species];
      const size = Math.max(def.silhouette.length, def.silhouette.height);
      window.__modelSize = size;
      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);

      document.getElementById('label').textContent =
        `${def.name}  (${species})\nlength ${def.silhouette.length}m  height ${def.silhouette.height}m  detail ${detail}`;

      /*
       * Frame from above the animal's own eye line, not from it.
       *
       * The camera used to sit at 0.75 of shoulder height, which for a
       * crocodile is thirty-seven centimetres — ground level. Everything long
       * and low was photographed edge-on and came out looking like a plank,
       * which is a fault in the camera, not in the model. Framing off the
       * *bounding size* puts a tortoise and a tiger at comparable angles.
       */
      /*
       * `zoom` and `at` exist for the parts that are small on purpose. A foot is
       * five centimetres of a three-metre animal, so at the framing that shows a
       * silhouette it is four pixels — and "are there toes on it" cannot be
       * answered from four pixels. `?zoom=6&at=0.9,0.05,0` puts the camera on
       * the front foot instead.
       */
      const zoom = Number(params.get('zoom') ?? 1);
      const at = (params.get('at') ?? '').split(',').map(Number);
      const target = at.length === 3 ? new THREE.Vector3(at[0], at[1], at[2])
                                     : new THREE.Vector3(0, def.silhouette.height * 0.45, 0);

      let t = angle;
      function frame() {
        if (spin) t += 0.01;
        const r = (size * 2.6) / zoom;
        const eye = target.y + Math.max(size * 0.42, def.silhouette.height * 1.15) / zoom;
        camera.position.set(target.x + Math.cos(t) * r, eye, target.z + Math.sin(t) * r);
        camera.lookAt(target);
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }
      /*
       * Publish where the first limb's lowest point is, so a caller can aim the
       * camera at a foot without knowing how this plan lays its legs out.
       */
      model.root.updateMatrixWorld(true);
      const firstLimb = model.knees[0] ?? model.legs[0];
      if (firstLimb) {
        let lowest = null;
        firstLimb.traverse((o) => {
          const p = o.getWorldPosition(new THREE.Vector3());
          if (!lowest || p.y < lowest.y) lowest = p;
        });
        window.__footTarget = [lowest.x, lowest.y + 0.05, lowest.z];
      }

      frame();
      window.__modelReady = true;
    </script>
  </body>
</html>
