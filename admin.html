<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Basilico Bistro</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%234C9A5C'/%3E%3Cpath d='M24 36c0-9 5-14 13-15 0 9-5 14-13 15Z' fill='%23F6EFE3'/%3E%3Cpath d='M24 38V22' stroke='%23E9B44C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="admin">

<!-- ==================== BEJELENTKEZÉS ==================== -->
<div class="login-shell" id="loginShell">
  <div class="glow glow-a" style="top:-10%;left:-10%"></div>
  <div class="glow glow-b" style="bottom:-14%;right:-8%"></div>

  <div class="card login-card">
    <div class="center-text">
      <div id="loginLogo" style="display:flex;justify-content:center"></div>
      <h1 style="font-size:1.7rem;margin-top:.8rem">Basilico Admin</h1>
      <p class="muted tiny">Belső felület — csak munkatársaknak</p>
    </div>

    <form id="loginForm" class="mt-3" novalidate>
      <div class="field">
        <label for="lUser">Felhasználónév</label>
        <input class="input" id="lUser" autocomplete="username" value="admin">
      </div>
      <div class="field mt-2">
        <label for="lPass">Jelszó</label>
        <input class="input" id="lPass" type="password" autocomplete="current-password" placeholder="••••••••••">
      </div>
      <p class="field-msg" id="loginMsg"></p>
      <button class="btn btn-primary btn-block mt-2" type="submit">Belépés</button>
    </form>

    <div class="login-hint mt-3">
      <b>Demó hozzáférés</b><br>
      felhasználó: <code>admin</code> · jelszó: <code>basilico2026</code><br>
      <span style="opacity:.8">Éles használatban ezt szerveroldali hitelesítésre kell cserélni — lásd README.</span>
    </div>

    <a class="link-arrow mt-3" href="index.html" style="display:inline-flex">← Vissza a weboldalra</a>
  </div>
</div>

<!-- ==================== ADMIN FELÜLET ==================== -->
<div class="admin-shell hidden" id="adminShell">

  <!-- Oldalsáv -->
  <aside class="admin-side">
    <a class="logo" href="index.html" style="margin-bottom:1rem">
      <span id="adminLogo"></span>
      <span class="logo-text"><span class="logo-name" style="font-size:1.05rem">Basilico</span>
      <span class="logo-sub">Admin</span></span>
    </a>

    <span class="side-label">Áttekintés</span>
    <button class="side-item on" data-view="dash"></button>
    <button class="side-item" data-view="bookings"></button>
    <button class="side-item" data-view="messages"></button>

    <span class="side-label">Tartalom</span>
    <button class="side-item" data-view="menu"></button>
    <button class="side-item" data-view="hours"></button>

    <span class="side-label">Rendszer</span>
    <button class="side-item" data-view="settings"></button>

    <div class="side-foot">
      <a class="side-item" href="index.html" target="_blank"></a>
      <button class="side-item" id="logoutBtn"></button>
    </div>
  </aside>

  <!-- Fő terület -->
  <main class="admin-main">
    <div class="admin-head">
      <div>
        <h1 style="font-size:clamp(1.5rem,3vw,2.1rem)" id="viewTitle">Vezérlőpult</h1>
        <p class="muted tiny" id="viewSub"></p>
      </div>
      <div class="row" style="gap:.5rem">
        <span id="adminStatus"></span>
        <button class="icon-btn" id="adminTheme" aria-label="Téma"></button>
      </div>
    </div>

    <div id="adminView"></div>
  </main>
</div>

<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
